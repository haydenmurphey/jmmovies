<!DOCTYPE html>
<html lang="">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js example</title>
        <style>
        body {
        padding: 0;
        margin: center;
        background-color: darkgray;
        }
        body {
            padding: 0;
            margin: center;
            background-color: darkgray;
        }

        .toggle-button,
        .review-box,
        .rating-score,
        .submit-button,
        .title,
        .search,
        .search-dropdown,
        .search-button,
        .login,
        .logout,
        .profile,
        .favorite,
        .back,
        .image,
        .list-selector,
        .submit-button,
        .rating-score,
        .add-to-list,
        .person-back-button {
            padding: 10px;
            border: 2px solid rgb(139, 46, 185);
            border-radius: 5px;
        }

        .title {
            border: 2px solid black;
            padding-left: 10px;
            text-align: left;
        }

        .title h1 {
            font-size: 35px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: linear-gradient(to right, rgb(95, 0, 95), rgb(192, 66, 255));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .title a:hover h1 {
            color: rgb(233, 255, 107);
        }

        .search-dropdown {
            font-size: 12px;
        }

        .toggle-button:hover,
        .rating-score:hover,
        .submit-button:hover,
        .search-dropdown:hover,
        .search-button:hover,
        .submit-button:hover,
        .login:hover,
        .logout:hover,
        .profile:hover,
        .favorite:hover,
        .back:hover,
        .rating-score:hover,
        .list-selector:hover,
        .add-to-list:hover,
        .person-back-button:hover {
            background-color: rgb(139, 46, 185);
            color: white;
            cursor: pointer;
        }

        .image,
        .actor {
            padding: 0px;
            border: 2px solid white;
            border-radius: 10px;
        }

        .image:hover,
        .actor:hover {
            border: 2px solid rgb(139, 46, 185);
            cursor: pointer;
        }

        .review-container {
            border: 2px solid rgb(139, 46, 185);
            padding: 5px;
            border-radius: 5px;
        }



        .total-review-text,
        .toWatch,
        .currently,
        .completed {
            font-size: 30px;
            font: bold;
            color: rgb(71, 0, 107)
        }


        .profile-username {
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            background: linear-gradient(to right, rgb(95, 0, 95), rgb(192, 66, 255));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
        }
        
        .movie_watchlist_div {
            position: absolute;
            top: 10%;
            left: 5%;
            display: flex;
            flex-direction: column;
        }

        .profile-image {
            height: 300px;
            width: 200px;
            margin-bottom: 5%;
        }

        .watchlist-button-div {
            display: flex;
        }

        .watchlist-container {
            width: auto;
            margin-left: 0;
            margin-right: auto;
        }

        .planning-container {
            border: 2px solid rgb(139, 46, 185);
            padding-left: 10px;
            padding-right: 40px;
            border-radius: 5px;
            margin-bottom: 3px;
        }
        .currently-container {
            border: 2px solid rgb(139, 46, 185);
            padding-left: 10px;
            padding-right: 40px;
            border-radius: 5px;
            margin-bottom: 3px;
        }
        .completed-container {
            border: 2px solid rgb(139, 46, 185);
            padding-left: 10px;
            padding-right: 5px;
            border-radius: 5px;
        }

        .movie-text {
            font-size: 12px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
        }

        .text-container {
            width: 120px;
            overflow: wrap;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        </style>
    <script src="../p5.js"></script>
    <script src="../api_key.js"></script>
    <!-- <script src="../addons/p5.sound.js"></script> -->

    <title>JMMovies</title>
    <link rel="stylesheet" type="text/css" href="style.css">

    </head>

    <body>
        <div class="title">
            <a href="./index.html">
                <h1>JMMovies</h1>
            </a>
        </div>
        <main>
            <script src="jmdb_main.js"></script>
            <script src="../lib/keyval.js"></script>
            <script src="./classes/movie.js"></script>
            <script src="./classes/person.js"></script>
            <script src="./classes/tv_show.js"></script>
            <script src="./classes/user.js"></script>
        </main>
    </body>

</html>
