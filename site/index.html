<!DOCTYPE html>

    <head>
    <meta charset="utf-8">

    <title>p5.js example</title>
        <style>
        body {
        padding: 0;
        margin: center;
        background-color: darkgray;
        }
        body {
            padding: 0;
            margin: center;
            background-color: darkgray;
        }

        .review-box,
        .rating-score,
        .submit-button,
        .title,
        .search,
        .search-dropdown,
        .search-button,
        .login,
        .logout,
        .profile,
        .favorite,
        .back,
        .image,
        .list-selector,
        .submit-button,
        .rating-score,
        .add-to-list {
            padding: 10px;
            border: 2px solid rgb(139, 46, 185);
            border-radius: 5px;
        }

        .title {
            border: 2px solid black;
            padding-left: 10px;
            text-align: left;
        }

        .title h1 {
            font-size: 35px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background: linear-gradient(to right, rgb(95, 0, 95), rgb(192, 66, 255));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .title a:hover h1 {
            color: rgb(233, 255, 107);
        }

        .search-dropdown {
            font-size: 12px;
        }

        .rating-score:hover,
        .submit-button:hover,
        .search-dropdown:hover,
        .search-button:hover,
        .submit-button:hover,
        .login:hover,
        .logout:hover,
        .profile:hover,
        .favorite:hover,
        .back:hover,
        .rating-score:hover,
        .list-selector:hover,
        .add-to-list:hover {
            background-color: rgb(139, 46, 185);
            color: white;
            cursor: pointer;
        }

        .image,
        .actor {
            padding: 0px;
            border: 2px solid white;
            border-radius: 10px;
            
        }

        .image:hover,
        .actor:hover {
            border: 2px solid rgb(139, 46, 185);
            cursor: pointer;
        }

        .review-container {
            border: 2px solid rgb(139, 46, 185);
            padding: 5px;
            border-radius: 5px;
        }

        .total-review-text {
            font-size: 30px;
            font: bold;
        }

        </style>
